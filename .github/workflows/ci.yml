name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Falha rápido: tipo, lint, token fora do design system ou
  #    workflow inválido aparecem em ~1min, sem gastar runner adiante.
  # ─────────────────────────────────────────────────────────────
  validacao:
    name: Validação
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipagem (tsc)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      # Torna executável o que o DESIGN_SYSTEM.md §7 antes só pedia na revisão.
      - name: Tokens do design system
        run: npm run check:tokens

      - name: Sintaxe dos workflows (actionlint)
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

  # ─────────────────────────────────────────────────────────────
  # 2. Compila e mede. O orçamento de bundle mora aqui porque é o
  #    build que o produz — não vale trafegar .next entre jobs.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: validacao
    steps:
      - uses: actions/checkout@v7

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar (next build)
        run: npm run build

      - name: Orçamento do JS compartilhado
        run: |
          # `tee` sem pipefail devolveria o status do tee, mascarando o estouro
          # do orçamento. PIPESTATUS guarda o status real do comando.
          set +e
          npm run --silent check:bundle | tee bundle.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### 📦 Bundle"
            echo ""
            echo '```'
            cat bundle.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f bundle.txt
          exit "$status"

      - name: Publicar artefato
        uses: actions/upload-artifact@v7
        with:
          name: aplicacao-build
          path: |
            .next/**
            !.next/cache/**
          # `.next` começa com ponto: sem isto o upload ignora tudo como oculto.
          include-hidden-files: true
          # Artefato vazio é falha de pipeline, não aviso a ser ignorado.
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 3 e 4 rodam EM PARALELO depois do build.
  # ─────────────────────────────────────────────────────────────
  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com cobertura
        run: npm run test:coverage

      - name: Resumo dos testes
        if: always()
        run: |
          {
            echo "### 🧪 Testes e cobertura"
            echo ""
            node scripts/coverage-summary.mjs
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  seguranca:
    name: Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: CodeQL — inicializar
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      # JavaScript não precisa de compilação para o CodeQL analisar.
      - name: CodeQL — analisar
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  # ─────────────────────────────────────────────────────────────
  # 5. Quality gate: consome a cobertura produzida no estágio 3.
  # ─────────────────────────────────────────────────────────────
  qualidade:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: testes
    steps:
      # fetch-depth 0: o Sonar precisa do histórico para atribuir
      # "código novo" ao autor e à data certos.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Recuperar cobertura do estágio 3
        uses: actions/download-artifact@v7
        with:
          name: cobertura
          path: coverage/

      # Sem o token, o scan falharia com erro de autenticação — que não diz
      # a ninguém o que fazer. Preferimos avisar o que falta configurar.
      - name: O quality gate está configurado?
        id: sonar
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ Quality gate não configurado"
              echo ""
              echo "A análise do SonarCloud foi pulada. Para ligá-la:"
              echo ""
              echo "1. Crie o projeto \`guicostak_revende-frontend\` em sonarcloud.io,"
              echo "   na organização \`guicostak\` (a mesma do revende-backend)."
              echo "2. Em *Administration → Analysis Method*, desligue a Automatic Analysis"
              echo "   — ela conflita com a análise vinda da pipeline."
              echo "3. Cadastre o segredo \`SONAR_TOKEN\` neste repositório."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: SonarCloud
        if: steps.sonar.outputs.configurado == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ─────────────────────────────────────────────────────────────
  # 6. Painel final: roda mesmo com estágio quebrado.
  # ─────────────────────────────────────────────────────────────
  resumo:
    name: Resumo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validacao, build, testes, seguranca, qualidade]
    if: always()
    steps:
      - name: Montar painel
        run: |
          icone() { case "$1" in
            success) echo "✅ passou" ;;
            failure) echo "❌ falhou" ;;
            cancelled) echo "⚪ cancelado" ;;
            skipped) echo "⏭️ pulado" ;;
            *) echo "❔ $1" ;;
          esac; }
          {
            echo "## Pipeline · ${{ github.ref_name }}"
            echo ""
            echo "| Estágio | Resultado |"
            echo "|---------|-----------|"
            echo "| Validação (tipos, lint, tokens, workflows) | $(icone '${{ needs.validacao.result }}') |"
            echo "| Build e orçamento de bundle | $(icone '${{ needs.build.result }}') |"
            echo "| Testes e cobertura | $(icone '${{ needs.testes.result }}') |"
            echo "| Segurança (CodeQL) | $(icone '${{ needs.seguranca.result }}') |"
            echo "| Quality gate (SonarCloud) | $(icone '${{ needs.qualidade.result }}') |"
            echo ""
            echo "Homologação (Nexus) sai quando a mensagem do commit em \`main\` contém \`#deployuat\`, ou por disparo manual."
            echo ""
            echo "Produção (revende.net) sai a cada push verde no \`main\`; PR ganha URL de pré-visualização."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reprovar se algum estágio falhou
        if: contains(needs.*.result, 'failure')
        run: |
          echo "Pelo menos um estágio falhou. Veja o painel acima."
          exit 1

  # ─────────────────────────────────────────────────────────────
  # 7. Publicação em homologação: imagem Docker no Nexus.
  #    Só em push no main, e só depois de TODOS os estágios passarem.
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Homologação (Nexus)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: resumo
    # Publicação sob demanda: só sai quando a mensagem do commit pede, ou por
    # disparo manual. Evita publicar a cada merge sem que ninguém tenha decidido.
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && contains(github.event.head_commit.message, '#deployuat'))
        || github.event_name == 'workflow_dispatch'
      )
    environment: homologacao

    steps:
      - uses: actions/checkout@v7

      # Sem as variáveis do Nexus o login falharia com erro de rede ou 401,
      # que não dizem a ninguém o que configurar. Ver infra/nexus/README.md §8.
      - name: O Nexus está configurado?
        id: nexus
        run: |
          if [ -n "${{ vars.NEXUS_REGISTRY }}" ] && [ -n "${{ secrets.NEXUS_PASSWORD }}" ]; then
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ Publicação pulada — Nexus não configurado"
              echo ""
              echo "Falta cadastrar a variável \`NEXUS_REGISTRY\` e os segredos"
              echo "\`NEXUS_USERNAME\` / \`NEXUS_PASSWORD\` neste repositório."
              echo ""
              echo "Passo a passo em \`infra/nexus/README.md\` §9."
              echo ""
              echo "> Lembre que um Nexus em \`localhost\` não é alcançável pelo runner"
              echo "> do GitHub: ou o runner é self-hosted, ou o Nexus tem endereço público."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Autenticar no Nexus
        if: steps.nexus.outputs.configurado == 'true'
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" \
            | docker login "${{ vars.NEXUS_REGISTRY }}" \
                -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin

      # `NEXT_PUBLIC_*` é inlinado em tempo de build: a imagem de homologação
      # aponta para a API de homologação e não pode ser reaproveitada em produção.
      - name: Construir e publicar imagem
        if: steps.nexus.outputs.configurado == 'true'
        id: publicar
        env:
          IMAGEM: ${{ vars.NEXUS_REGISTRY }}/${{ vars.NEXUS_IMAGE || 'revende-frontend' }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.UAT_API_URL }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.UAT_SITE_URL }}" \
            -t "$IMAGEM:${{ github.sha }}" \
            -t "$IMAGEM:homologacao" \
            .
          docker push "$IMAGEM:${{ github.sha }}"
          docker push "$IMAGEM:homologacao"
          echo "imagem=$IMAGEM:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Registrar publicação
        if: steps.nexus.outputs.configurado == 'true'
        run: |
          {
            echo "### 🚀 Publicado em homologação"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Imagem | \`${{ steps.publicar.outputs.imagem }}\` |"
            echo "| Tag móvel | \`homologacao\` |"
            echo "| Registry | ${{ vars.NEXUS_REGISTRY }} |"
            echo "| API embutida | ${{ vars.UAT_API_URL }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  # 8. Pré-visualização: todo PR ganha uma URL própria na Vercel,
  #    construída do mesmo commit que passou pelos estágios acima.
  # ─────────────────────────────────────────────────────────────
  preview:
    name: Pré-visualização (Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: resumo
    if: github.event_name == 'pull_request'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Mesma guarda do Nexus: sem os segredos, `vercel pull` falharia com um
      # erro de autenticação que não diz a ninguém o que precisa ser cadastrado.
      - name: A Vercel está configurada?
        id: vercel
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "configurada=true" >> "$GITHUB_OUTPUT"
          else
            echo "configurada=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ Pré-visualização pulada — Vercel não configurada"
              echo ""
              echo "Faltam os segredos \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\` e"
              echo "\`VERCEL_PROJECT_ID\` neste repositório."
              echo ""
              echo "Passo a passo em \`infra/vercel/README.md\` §3."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Instalar a CLI da Vercel
        if: steps.vercel.outputs.configurada == 'true'
        run: npm i -g vercel@latest

      # `vercel pull` traz as variáveis de preview guardadas na Vercel.
      # `NEXT_PUBLIC_*` é inlinado no build: é aqui que ele entra.
      - name: Puxar configuração de preview
        if: steps.vercel.outputs.configurada == 'true'
        run: vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Construir
        if: steps.vercel.outputs.configurada == 'true'
        run: vercel build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Publicar pré-visualização
        if: steps.vercel.outputs.configurada == 'true'
        id: publicar
        run: |
          url=$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Registrar pré-visualização
        if: steps.vercel.outputs.configurada == 'true'
        run: |
          {
            echo "### 🔍 Pré-visualização publicada"
            echo ""
            echo "${{ steps.publicar.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  # 9. Produção: revende.net. O estado do `main` é o estado do site —
  #    todo merge verde publica, sem passo manual em painel nenhum.
  #    `vercel.json` desliga o deploy automático da própria Vercel para
  #    que este job seja o único caminho até o domínio.
  # ─────────────────────────────────────────────────────────────
  producao:
    name: Produção (Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: resumo
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: producao
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: A Vercel está configurada?
        id: vercel
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "configurada=true" >> "$GITHUB_OUTPUT"
          else
            echo "configurada=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ Publicação pulada — Vercel não configurada"
              echo ""
              echo "Faltam os segredos \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\` e"
              echo "\`VERCEL_PROJECT_ID\` neste repositório."
              echo ""
              echo "Passo a passo em \`infra/vercel/README.md\` §3."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Instalar a CLI da Vercel
        if: steps.vercel.outputs.configurada == 'true'
        run: npm i -g vercel@latest

      - name: Puxar configuração de produção
        if: steps.vercel.outputs.configurada == 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Construir
        if: steps.vercel.outputs.configurada == 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Publicar em produção
        if: steps.vercel.outputs.configurada == 'true'
        id: publicar
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Registrar publicação
        if: steps.vercel.outputs.configurada == 'true'
        run: |
          {
            echo "### 🚀 Publicado em produção"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Domínio | https://revende.net |"
            echo "| Deployment | ${{ steps.publicar.outputs.url }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
