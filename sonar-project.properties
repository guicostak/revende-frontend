# SonarCloud — mesma organização do revende-backend.
sonar.organization=guicostak
sonar.projectKey=guicostak_revende-frontend
sonar.projectName=revende-frontend

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**

# Cobertura produzida pelo Vitest (`npm run test:coverage`).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fora da análise: gerado, sem lógica própria, ou já coberto por outra regra.
sonar.exclusions=\
  node_modules/**,\
  .next/**,\
  coverage/**,\
  public/**,\
  next-env.d.ts

# Duplicação em arquivo de teste é esperada (cenários parecidos por design).
sonar.cpd.exclusions=src/**/*.test.ts,src/**/*.test.tsx
